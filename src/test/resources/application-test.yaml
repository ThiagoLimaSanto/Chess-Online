spring:
  datasource:
    url: jdbc:h2:mem:chess;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  data:
    redis:
      host: localhost
      port: 6379
  flyway:
    enabled: false

logging:
  level:
    root: WARN
