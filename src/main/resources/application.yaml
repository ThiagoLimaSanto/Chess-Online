spring:
  application:
    name: chess-backend

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      maximum-pool-size: 5
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

  data:
    redis:
      host: redis
      port: 6379

  flyway:
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: 8080

app:
  cors:
    allowed-origins: ${HTTP_ALLOWED_ORIGINS}
  websocket:
    allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS}
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:15m}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:7d}
  refresh-cookie-secure: ${JWT_REFRESH_COOKIE_SECURE:false}
  refresh-cookie-name: ${JWT_REFRESH_COOKIE_NAME:chess-refresh-token}
  refresh-cookie-same-site: ${JWT_REFRESH_COOKIE_SAME_SITE:Lax}
